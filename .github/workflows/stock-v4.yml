name: US Stock System V4

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'stock_system/strategy_v4.py'
      - 'stock_system/run_v4.py'
      - '.github/workflows/stock-v4.yml'

permissions:
  contents: write

concurrency:
  group: stock-system-v4
  cancel-in-progress: true

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run US stock V4 backtest
        run: python stock_system/run_v4.py
      - name: Persist stock V4 results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f stock_system/results/v4_*
          if git diff --cached --quiet; then
            echo "No result changes"
          else
            git commit -m "Update US stock V4 backtest results"
            git pull --rebase origin main
            git push
          fi
