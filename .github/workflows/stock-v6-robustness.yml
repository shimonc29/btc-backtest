name: US Stock System V6 Robustness

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'stock_system/strategy_v6.py'
      - 'stock_system/run_v6.py'
      - 'stock_system/robustness_v6.py'
      - '.github/workflows/stock-v6-robustness.yml'

permissions:
  contents: write

concurrency:
  group: stock-system-v6-robustness
  cancel-in-progress: true

jobs:
  robustness:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run V6 robustness suite
        run: python stock_system/robustness_v6.py
      - name: Persist V6 robustness results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f stock_system/results/v6_robustness.csv stock_system/results/v6_robustness_summary.json stock_system/results/v6_summary.json stock_system/results/v6_equity.csv stock_system/results/v6_rebalances.csv
          if git diff --cached --quiet; then
            echo "No result changes"
          else
            git commit -m "Update US stock V6 audited robustness results"
            git pull --rebase origin main
            git push
          fi
