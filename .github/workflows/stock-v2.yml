name: US Stock System V2

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'stock_system/strategy_v2.py'
      - 'stock_system/run_v2.py'
      - '.github/workflows/stock-v2.yml'

permissions:
  contents: write

concurrency:
  group: stock-system-v2
  cancel-in-progress: true

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run US stock V2 backtest
        run: python stock_system/run_v2.py
      - name: Persist stock V2 results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f stock_system/results/v2_summary.json stock_system/results/v2_trades.csv stock_system/results/v2_equity.csv
          if git diff --cached --quiet; then
            echo "No result changes"
          else
            git commit -m "Update US stock V2 backtest results"
            git pull --rebase origin main
            git push
          fi
