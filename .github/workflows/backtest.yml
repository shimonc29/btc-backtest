name: BTC Backtest

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backtest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Download and validate BTC data
        run: python data_loader.py

      - name: Run V1 research
        run: |
          mkdir -p results
          python research.py data/btc_4h_data_2018_to_2025.csv --equity 2000
          mv research_summary.csv results/research_v1_summary.csv

      - name: Run V1 trade log
        run: |
          python backtest.py data/btc_4h_data_2018_to_2025.csv --equity 2000
          mv btc_pullback_v1_trades.csv results/btc_pullback_v1_trades.csv

      - name: Run V2 research
        run: |
          python research_v2.py data/btc_4h_data_2018_to_2025.csv --equity 2000
          mv research_v2_summary.csv results/research_v2_summary.csv

      - name: Run V2 trade log
        run: |
          python backtest_v2.py data/btc_4h_data_2018_to_2025.csv --equity 2000
          mv btc_pullback_v2_trades.csv results/btc_pullback_v2_trades.csv

      - name: Run V3 research
        run: |
          python research_v3.py data/btc_4h_data_2018_to_2025.csv --equity 2000
          mv research_v3_summary.csv results/research_v3_summary.csv

      - name: Run V3 trade log
        run: |
          python backtest_v3.py data/btc_4h_data_2018_to_2025.csv --equity 2000
          mv btc_momentum_v3_trades.csv results/btc_momentum_v3_trades.csv

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/*.csv
          if git diff --cached --quiet; then
            echo "No result changes to commit"
          else
            git commit -m "Update BTC backtest results"
            git push
          fi
